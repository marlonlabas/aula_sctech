<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 28 - Validação de Formulários</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        .error-message {
            color: red;
            font-size: 12px;
            display: none;
        }
        button{
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button:hover {
            background-color: #ffc400;
        }
    </style>
</head> 
<body>
    <h1>Formulário de Contato</h1>
    <form id="contactForm" novalidate>
        <div>
            <label for="name">Nome:</label>
            <input type="text" id="name" required maxlength="256">
            <span class="error-message">O nome é obrigatório.</span>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" required maxlength="356">
            <span class="error-message">O email é obrigatório e deve ser válido.</span>
        </div>
        <div>
            <label for="message">Mensagem:</label>
            <textarea id="message" required></textarea>
            <span class="error-message">A mensagem é obrigatória.</span>
        </div>
        <button type="submit" onclick="validateForm()">Enviar</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
